name: Workflow Syntax Validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint changed workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed workflow changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.x"
      - name: Validate changed workflow syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          mapfile -t workflow_files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if (( ${#workflow_files[@]} == 0 )); then
            echo "No changed workflow files to validate."
            exit 0
          fi
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color "${workflow_files[@]}"
